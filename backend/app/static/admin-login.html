<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In • AUTOPILOT Control Center</title>
  <link rel="stylesheet" href="/static/admin.css">
  <style>
    body {
      background: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      box-sizing: border-box;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 0.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .brand-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.5rem;
      background: #f1f5f9;
      color: #475569;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
    }
    .brand-subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin: 0;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.375rem;
    }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #1e293b;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #ffffff;
      background: #0f172a;
      border: 1px solid #0f172a;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: #1e293b;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert-banner {
      display: none;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.8125rem;
      border-radius: 6px;
      line-height: 1.4;
    }
    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <h1 class="brand-title">
        AUTOPILOT <span class="brand-badge">Control</span>
      </h1>
      <p class="brand-subtitle">Privileged Administrator Access</p>
    </div>

    <div id="alertBox" class="alert-banner alert-error" role="alert"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="adminEmail">Admin Email or Username</label>
        <input class="form-input" type="text" id="adminEmail" required placeholder="admin_abhay" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password</label>
        <input class="form-input" type="password" id="adminPassword" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Sign In to Control Center</button>
    </form>

    <div class="footer-note">
      AUTOPILOT Enterprise • Multi-Tenant RBAC Enforced
    </div>
  </div>

  <script>
    const form = document.getElementById("adminLoginForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      alertBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Authenticating...";

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      try {
        const resp = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const res = await resp.json();
        if (!resp.ok || !res.success) {
          const msg = (res.error && res.error.message) || res.detail || "Authentication failed.";
          throw new Error(msg);
        }

        const session = res.data;
        if (session.user.role !== "admin") {
          throw new Error("Access denied. Administrative privileges are required.");
        }

        localStorage.setItem("autopilot_admin_token", session.tokens.accessToken);
        localStorage.setItem("autopilot_admin_user", JSON.stringify(session.user));
        window.location.href = "/admin/dashboard";
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In to Control Center";
      }
    });
  </script>
</body>
</html>
