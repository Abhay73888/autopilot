<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTOPILOT • Admin Control Center</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <noscript>
    <div style="padding: 2rem; font-family: sans-serif; text-align: center; color: #b91c1c;">
      <h2>JavaScript Required</h2>
      <p>The AUTOPILOT Admin Control Center requires JavaScript to manage users, data, and system controls.</p>
    </div>
  </noscript>

  <div class="admin-layout" id="appShell">
    <!-- Fixed Left Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <a href="/admin/dashboard" class="sidebar-brand-title">
          <span>AUTOPILOT</span>
          <span class="sidebar-brand-badge">Control</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <!-- Group 1: OVERVIEW -->
        <div class="nav-group">
          <div class="nav-group-title">Overview</div>
          <ul class="nav-list">
            <li>
              <a href="/admin/dashboard" class="nav-item-link" data-route="/admin/dashboard">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Dashboard</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Group 2: USERS -->
        <div class="nav-group">
          <div class="nav-group-title">Users</div>
          <ul class="nav-list">
            <li>
              <a href="/admin/users" class="nav-item-link" data-route="/admin/users">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Users</span>
              </a>
            </li>
            <li>
              <a href="/admin/activity" class="nav-item-link" data-route="/admin/activity">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                <span>Activity Monitor</span>
              </a>
            </li>
            <li>
              <a href="/admin/audit" class="nav-item-link" data-route="/admin/audit">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <span>Audit Trail</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Group 3: AUTOPILOT DATA -->
        <div class="nav-group">
          <div class="nav-group-title">Autopilot Data</div>
          <ul class="nav-list">
            <li>
              <a href="/admin/projects" class="nav-item-link" data-route="/admin/projects">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <span>Projects</span>
              </a>
            </li>
            <li>
              <a href="/admin/videos" class="nav-item-link" data-route="/admin/videos">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                <span>Videos</span>
              </a>
            </li>
            <li>
              <a href="/admin/youtube" class="nav-item-link" data-route="/admin/youtube">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
                <span>YouTube Connections</span>
              </a>
            </li>
            <li>
              <a href="/admin/usage" class="nav-item-link" data-route="/admin/usage">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                <span>AI Usage</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Group 4: SYSTEM -->
        <div class="nav-group">
          <div class="nav-group-title">System</div>
          <ul class="nav-list">
            <li>
              <a href="/admin/reports" class="nav-item-link" data-route="/admin/reports">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span>Reports</span>
              </a>
            </li>
            <li>
              <a href="/admin/settings" class="nav-item-link" data-route="/admin/settings">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Settings</span>
              </a>
            </li>
            <li>
              <a href="/admin/profile" class="nav-item-link" data-route="/admin/profile">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Admin Profile</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="admin-badge-card">
          <div class="admin-badge-info">
            <span class="admin-badge-name" id="sidebarAdminName">Administrator</span>
            <span class="admin-badge-role">Super Admin</span>
          </div>
          <button class="btn-logout" id="logoutBtn" title="Sign out" aria-label="Sign out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main App Body -->
    <main class="admin-main">
      <header class="admin-header">
        <div class="header-left">
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <span class="header-meta-label" id="pageMetaLabel">Enterprise</span>
        </div>
        <div class="header-right">
          <button class="notif-btn" id="notifBell" aria-label="Notifications">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="notif-badge" id="notifBadge" style="display: none;">0</span>
          </button>
        </div>
      </header>

      <div class="admin-canvas" id="mainCanvas">
        <!-- Rendered dynamically by admin.js router -->
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modalHost"></div>

  <!-- Toast Notification Host -->
  <div class="toast-container" id="toastHost"></div>

  <script src="/static/admin.js"></script>
</body>
</html>
