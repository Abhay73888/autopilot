# =====================================================================
# AUTOPILOT — SECTION 0 CONFIG
# Ye file poore system ka "control panel" hai.
# Sirf yahi file badlo, code haath mat lagao.
# (Format: simple YAML — key: value. Nested block 2 space indent se.)
# =====================================================================

# ============ CHANNEL IDENTITY ============
niche:            "unsolved mysteries + true suspense stories"
language:         "Hindi"                 # Hindi | English | Hinglish
target_audience:  "India, 18-34, mobile-first"
visual_style:     "flat 2D cartoon, noir shadows, muted teal-orange palette"
brand_name:       "whop"

# ============ VIDEO PROFILES ============
active_profile: shorts
video_profiles:
  shorts:
    length_sec: 32
    resolution: "720x1280"
    aspect: "9:16"
    sec_per_scene: 4.5
    subtitles: kinetic
  longform:
    length_sec: 600
    resolution: "1920x1080"
    aspect: "16:9"
    sec_per_scene: 6.0
    subtitles: clean
    chapters: true
    max_length_sec: 3600

# ============ OUTPUT TARGETS (Legacy) ============
video_length_sec:  32                     # 22-45s sweet spot
videos_per_day:    2
aspect_ratio:      "9:16"
resolution:        "720x1280"               # Cloud-safe: 720p saves 3x RAM vs 1080p on Render 512MB

# ============ ACCOUNTS ============
instagram_handle:  "@your_handle"         # TODO: Business/Creator account hona chahiye
youtube_channel:   "https://youtube.com/channel/UCOvDjaHzT3kUgJinQV_4vDQ"

# ============ BUDGET ============
monthly_budget_inr: 0                     # ZERO — sirf free tiers

# ============ AUTONOMY ============
autonomy: "review_first"                  # review_first | auto_publish
review_first_count: 20                    # pehle 20 video manually approve honge

# ============ RUNTIME ============
mock_mode: false                          # false = real Gemini API use karega (GEMINI_API_KEY .env mein honi chahiye)
timezone: "Asia/Kolkata"
db_path: "data/autopilot.db"
log_dir: "logs"

# ============ LLM ROUTING (Optional per-agent override) ============
# Har agent ko alag backend assign kar sakte ho: kimi (moonshot) | gemini | mock
# Agar yahan empty hai ya agent defined nahi hai, to global .env rule chalega.
llm_routing:
  # writer: kimi
  # trendscout: gemini
  # metadata: gemini
  # artdirector: kimi

# ============ PHASE 5: AI PUBLISHING ============
default_playlist: ""                      # naam do to har upload isme jayega (banegi agar nahi hai)
seo_min_score: 60                         # isse kam SEO score pe warning milegi

# ============ VOICE CONFIGURATION (Phase A) ============
voice:
  engine_order: [gemini_tts, edge_tts, gtts, espeak]
  gemini_tts_model: gemini-2.5-flash-preview-tts
  speed: 1.20                              # Voiceover speed multiplier (1.20x fast pacing for YouTube Shorts)
  dialogue_share: 0.4
  force_mixed_gender: true

# ============ CINEMATIC EFFECTS CONFIGURATION (Phase B & C) ============
effects:
  sound:
    heartbeat: true
    riser: true
    sub_hit: true
    flash_click: true
    room_tone: true
    ducking: true
    master_limiter: true
  visual:
    color_grade: true             # Cheap: single color balance pass
    film_grain: true              # 35mm subtle grain
    vignette_pulse: true          # Dynamic vignette oscillation
    camera_shake: true            # Cinematic micro-shake on intense beats
    flash_cut: true               # Cheap: single fade at start
    speed_ramp: false
    breathing: true               # Subtle organic breathing motion
    layered_scenes: false
    particles: false
  character_consistency:
    enabled: true
    reuse_existing: true
    inject_keywords: true
    seed_proximity: true
    negative_prompt_extra: "different face, inconsistent clothing, different actor, cartoon, 3d render"

# ============ VIDEO GENERATION & WAN2.1 ============
videogen:
  enabled: true
  provider: "wan2.1"          # "wan2.1" | "flux_motion"
  model_variant: "1.3b"       # "1.3b" (fast) | "14b" (cinema grade)
  api_backend: "replicate"    # "replicate" | "fal" | "local"
  fps: 24
  duration_per_scene: 3.5

# ============ ML OPTIMIZER & RETENTION FLYWHEEL ============
ml_optimizer:
  enabled: true
  retention_target: 0.70      # 70% retention benchmark
  learning_rate: 0.05
  min_training_samples: 3
  auto_evolve_prompts: true

# ============ CRITICAL USER RESTRICTION: COMMENTS ALWAYS ON ============
# ⚠️ MANDATORY: Comments section must NEVER be disabled on any video!
comments_policy:
  force_comments_enabled: true
  self_declared_made_for_kids: false
  allow_comments_disabled: false


