version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autopilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autopilot
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autopilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: autopilot_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - AUTOPILOT_MOCK_MODE=true
      - DATABASE_URL=postgresql://autopilot:autopilot_secret_password@postgres:5432/autopilot
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - PORT=8000
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: autopilot_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - AUTOPILOT_MOCK_MODE=true
      - DATABASE_URL=postgresql://autopilot:autopilot_secret_password@postgres:5432/autopilot
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autopilot_dashboard
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - AUTOPILOT_MOCK_MODE=true
      - PORT=8765
      - HOST=0.0.0.0
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output

volumes:
  postgres_data:
  redis_data:
